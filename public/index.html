<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13111c">
<title>Doodle Dash</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="banner" hidden>Reconnecting…</div>

<section id="home" class="card narrow" hidden>
  <h1>Doodle<span>Dash</span></h1>
  <p class="sub">Draw it. Guess it. 2–8 players.</p>
  <label>Your name<input id="name" maxlength="14" autocomplete="nickname" placeholder="Pat"></label>
  <button id="create" class="primary">Create room</button>
  <div class="or">or join a friend</div>
  <div class="row">
    <input id="code" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" aria-label="Room code">
    <button id="join">Join</button>
  </div>
  <p id="homeErr" class="err" role="alert"></p>
</section>

<section id="lobby" class="card narrow" hidden>
  <p class="sub">Room code</p>
  <div id="lobbyCode" class="bigcode"></div>
  <button id="invite">Copy invite link</button>
  <ul id="lobbyPlayers" class="chips"></ul>
  <label id="roundsRow" class="rounds">Rounds
    <select id="rounds" aria-describedby="roundsHelp"></select>
  </label>
  <p id="roundsHelp" class="sub small"></p>
  <p class="sub small">Difficulty: Easy ×1, Medium ×1.5, Hard ×2 points. The drawer picks one of three words; faster guesses score more.</p>
  <button id="start" class="primary" hidden>Start game</button>
  <p id="lobbyHint" class="sub"></p>
  <p id="lobbyErr" class="err" role="alert"></p>
  <button id="leaveLobby" class="link">Leave</button>
</section>

<section id="game" hidden>
  <header class="top">
    <div id="roundInfo"></div>
    <div id="hint" class="hint"></div>
    <div id="timer" class="timer">0</div>
  </header>
  <div id="bar"><i id="barFill"></i></div>
  <div class="layout">
    <div class="stage">
      <div class="canvaswrap">
        <canvas id="cv" width="800" height="600"></canvas>
        <div id="overlay" hidden></div>
      </div>
      <div id="tools" hidden>
        <div id="colors" role="group" aria-label="Colors"></div>
        <div id="sizes" role="group" aria-label="Brush size"></div>
        <div id="acts"><button id="eraser" aria-pressed="false">Eraser</button><button id="clear">Clear</button></div>
      </div>
    </div>
    <aside>
      <ul id="board" class="board" aria-label="Scores"></ul>
      <div id="chat" class="chat" tabindex="-1"></div>
      <form id="guessForm" autocomplete="off">
        <input id="guess" maxlength="40" placeholder="Type your guess" aria-label="Guess">
        <button class="primary">Guess</button>
      </form>
      <p id="gameErr" class="err" role="alert"></p>
    </aside>
  </div>
</section>
<script src="/geom.js"></script>
<script src="/app.js"></script>
</body>
</html>
